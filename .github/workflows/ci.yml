name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[train,service,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t anomaly-api:ci .
      - name: Container runs as non-root
        run: test "$(docker run --rm --entrypoint id anomaly-api:ci -u)" = "10001"
      - name: Service module imports inside the image
        run: docker run --rm --entrypoint python anomaly-api:ci -c "import anomaly.service.app"