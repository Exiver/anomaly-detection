global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: anomaly-api
    metrics_path: /metrics
    authorization:
      credentials: dev-secret   # placeholder; match AD_API_KEY locally, keep real keys out of Git
    static_configs:
      - targets: ["anomaly-api:8000"]
